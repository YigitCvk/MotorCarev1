name: Staging CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/MotorCare.sln

      - name: Build
        run: dotnet build src/MotorCare.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/MotorCare.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/MotorCare.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/MotorCare.Web
        run: npm ci

      - name: Build
        working-directory: src/MotorCare.Web
        run: npm run build

  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        # Only authenticate when we intend to push (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── Backend API image ────────────────────────────────────────────────────

      - name: Build & push backend API image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/MotorCare.Api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/motorcare-api:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/motorcare-api:staging-latest
          build-args: |
            MOTORCARE_COMMIT_SHA=${{ github.sha }}

      # ── Frontend web image ───────────────────────────────────────────────────

      - name: Build & push frontend web image
        uses: docker/build-push-action@v6
        with:
          context: src/MotorCare.Web
          file: src/MotorCare.Web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/motorcare-web:${{ github.sha }}
            ${{ secrets.REGISTRY_URL }}/motorcare-web:staging-latest

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()

    steps:
      - name: Write job summary
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Staging CI — Build Status"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Backend (build & test) | \`${BACKEND_RESULT}\` |"
            echo "| Frontend (build)       | \`${FRONTEND_RESULT}\` |"
            echo "| Docker (build & push)  | \`${DOCKER_RESULT}\` |"
            echo ""
            echo "**Trigger:** \`${EVENT_NAME}\` on \`${REF}\`"
            echo ""
            echo "**Commit:** \`${SHA}\`"
            echo ""
            if [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/main" ]]; then
              echo "**Images pushed to registry:** yes"
              echo "- \`motorcare-api:${SHA}\` / \`motorcare-api:staging-latest\`"
              echo "- \`motorcare-web:${SHA}\` / \`motorcare-web:staging-latest\`"
            else
              echo "**Images pushed to registry:** no (PR or non-main push)"
            fi
            echo ""
            echo "[View full run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
