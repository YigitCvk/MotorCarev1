<section class="feature-header">
  <div>
    <span class="eyebrow">Müşteri ekle</span>
    <h1>Yeni Müşteri</h1>
  </div>

  <a class="secondary-action" routerLink="/customers">Geri</a>
</section>

<section *ngIf="errorMessage" class="state-panel error">
  <strong>İşlem tamamlanamadı</strong>
  <span>{{ errorMessage }}</span>
</section>

<form class="form-panel" [formGroup]="form" (ngSubmit)="save()">
  <div class="form-grid">
    <label>
      <span>Ad Soyad *</span>
      <input type="text" formControlName="fullName" maxlength="150" placeholder="Ahmet Yılmaz" />
      <small *ngIf="isInvalid('fullName')">Ad Soyad zorunludur ve 150 karakteri geçemez.</small>
    </label>

    <label>
      <span>Telefon *</span>
      <input type="tel" formControlName="phone" maxlength="20" placeholder="05xx xxx xx xx" />
      <small *ngIf="isInvalid('phone')">Telefon numarası zorunludur ve 20 karakteri geçemez.</small>
    </label>

    <label>
      <span>E-posta</span>
      <input type="email" formControlName="email" maxlength="150" placeholder="ornek@mail.com" />
      <small *ngIf="isInvalid('email')">Geçerli bir e-posta adresi girin.</small>
    </label>

    <label>
      <span>WhatsApp</span>
      <input type="tel" formControlName="whatsapp" maxlength="20" placeholder="Boşsa telefon kullanılabilir" />
      <small *ngIf="isInvalid('whatsapp')">WhatsApp numarası 20 karakteri geçemez.</small>
    </label>

    <label class="full-span">
      <span>İç Not</span>
      <textarea rows="4" formControlName="notes" maxlength="1000" placeholder="Müşteriye özel iç not"></textarea>
      <small *ngIf="isInvalid('notes')">Not alanı 1000 karakteri geçemez.</small>
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" class="primary-action" [disabled]="isSaving">
      {{ isSaving ? 'Kaydediliyor...' : 'Müşteri Kaydet' }}
    </button>
  </div>
</form>
