<div class="app-shell">
  <aside class="sidebar" [class.open]="menuOpen">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <strong>BakımSuite</strong>
      <span>MotorCare MVP</span>
    </a>

    <nav class="nav-list" aria-label="Ana menü">
      <a
        *ngFor="let item of visiblePrimaryNavigation; trackBy: trackByPath"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="closeMenu()"
      >
        {{ item.label }}
      </a>
    </nav>

    <nav class="nav-list" aria-label="Ayarlar">
      <a
        *ngFor="let item of visibleAdminNavigation; trackBy: trackByPath"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="closeMenu()"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="user-summary" *ngIf="currentUser$ | async as user">
      <strong>{{ user.fullName || user.email }}</strong>
      <small>{{ roleLabel(user.role) }}</small>
      <small>{{ user.tenantIdentifier || user.tenantId }}</small>
    </div>

    <button type="button" (click)="logout()">Çıkış</button>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button class="ghost-button mobile-menu-button" type="button" (click)="toggleMenu()">Menü</button>
      <div *ngIf="currentUser$ | async as user">
        <strong>{{ user.tenantIdentifier || 'MotorCare' }}</strong>
        <small>{{ user.email }}</small>
      </div>
      <button class="ghost-button" type="button" (click)="logout()">Çıkış</button>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
